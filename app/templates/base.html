<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Armada Sales{% endblock %}</title>
  <style>
    :root { --accent: #1d4ed8; --bg: #f7f8fa; --border: #e2e4e9; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: var(--bg); color: #1f2430; }
    nav { background: #111827; padding: 14px 24px; display: flex; gap: 20px; align-items: center; }
    nav a { color: #d1d5db; text-decoration: none; font-size: 14px; }
    nav a:hover, nav a.active { color: #fff; font-weight: 600; }
    nav .brand { color: #fff; font-weight: 700; margin-right: 12px; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
    h1 { font-size: 22px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: #f1f2f5; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .btn { display: inline-block; background: var(--accent); color: #fff; border: none; padding: 7px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; text-decoration: none; }
    .btn.secondary { background: #6b7280; }
    .btn.danger { background: #dc2626; }
    .btn.small { padding: 4px 9px; font-size: 12px; }
    input, select, textarea { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 13px; width: 100%; }
    label { font-size: 12px; color: #555; display: block; margin-bottom: 3px; margin-top: 8px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 180px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; background: #e5e7eb; color: #374151; }
    .badge.warm { background: #fef3c7; color: #92400e; }
    .badge.customer { background: #d1fae5; color: #065f46; }
    .badge.lost { background: #fee2e2; color: #991b1b; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; }
    .flash.success { background: #d1fae5; color: #065f46; }
    .flash.error { background: #fee2e2; color: #991b1b; }
    .stage-grid { display: flex; gap: 10px; flex-wrap: wrap; }
    .stage-pill { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; text-align: center; min-width: 110px; }
    .stage-pill .count { font-size: 22px; font-weight: 700; color: var(--accent); }
    .muted { color: #6b7280; font-size: 13px; }
    a.link { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">Armada Sales</span>
    <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('main.companies_list') }}">Companies</a>
    <a href="{{ url_for('main.prospects_search') }}">Find Prospects</a>
    <a href="{{ url_for('main.companies_import') }}">Import CSV</a>
    <a href="{{ url_for('main.templates_list') }}">Email Templates</a>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
